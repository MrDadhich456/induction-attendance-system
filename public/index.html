<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Induction Check-In</title>
<style>
  :root{--navy:#10213f;--blue:#306bff;--violet:#8058ff;--aqua:#29d8c0;--ink:#14223d;--muted:#6b7891;--line:#dfe7f7;--card:rgba(255,255,255,.88);--good:#0d9a70;--bad:#df4d48;--ring:rgba(48,107,255,.12)}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 18px;background:#0b1630;position:relative;overflow-x:hidden}
  body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(12px);pointer-events:none}body:before{width:540px;height:540px;top:-230px;left:-170px;background:radial-gradient(circle,#3d80ff 0,rgba(61,128,255,0) 70%)}body:after{width:480px;height:480px;right:-180px;bottom:-240px;background:radial-gradient(circle,#9e62ff 0,rgba(158,98,255,0) 70%)}
  .card{width:100%;max-width:456px;background:var(--card);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7);border-radius:28px;padding:32px 28px 26px;box-shadow:0 28px 70px rgba(1,9,28,.36);position:relative;overflow:hidden}.card:before{content:"";height:5px;position:absolute;left:0;right:0;top:0;background:linear-gradient(90deg,var(--aqua),var(--blue),var(--violet))}
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}.eyebrow:before{content:"";width:22px;height:2px;background:var(--aqua);border-radius:8px}
  h1{font-size:28px;line-height:1.05;margin:0 0 8px;letter-spacing:-.045em}.venue{font-size:13px;color:var(--muted);margin-bottom:18px;font-weight:600}

  .radar{
    width:104px;height:104px;margin:0 auto 22px;position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .radar .ring{
    position:absolute;border-radius:50%;border:2px solid var(--blue);
    opacity:0; animation: pulse 2.2s ease-out infinite;
  }
  .radar .ring:nth-child(2){ animation-delay: 0.7s; }
  .radar .ring:nth-child(3){ animation-delay: 1.4s; }
  @keyframes pulse{
    0%{ width:20px; height:20px; opacity:0.55; }
    100%{ width:104px; height:104px; opacity:0; }
  }
  .pin{
    width:18px;height:18px;border-radius:50% 50% 50% 0;background:var(--blue);transform:rotate(-45deg);z-index:2;box-shadow:0 6px 14px rgba(48,107,255,.36)
  }
  .radar.idle .ring{ animation:none; opacity:0; }
  .radar.idle .pin{background:var(--muted)}.radar.ok .pin{background:var(--good)}.radar.err .pin{background:var(--bad)}
  .radar.ok .ring, .radar.err .ring{ animation:none; opacity:0; }

  label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 7px;text-transform:uppercase;letter-spacing:.07em}.field{margin-bottom:14px}
  input[type=text], input[type=tel], input[type=email]{
    width:100%;padding:14px 15px;border-radius:14px;border:1.5px solid var(--line);font-size:16px;outline:none;transition:.18s;background:rgba(250,252,255,.8);color:var(--ink)
  }
  input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(48,107,255,.11);background:#fff}.optional{font-weight:500;color:#9aa7bd;text-transform:none;letter-spacing:0}

  button{
    width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(100deg,var(--blue),var(--violet));color:white;font-size:15px;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:.2s;margin-top:4px;box-shadow:0 12px 24px rgba(69,83,223,.27)
  }
  button:hover{transform:translateY(-1px);filter:brightness(1.05)}
  button:active{ transform: scale(0.98); }
  button:disabled{ background:#B9C2D2; cursor:not-allowed; }

  .msg{
    margin-top:16px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;
    display:none;
  }
  .msg.show{ display:block; }
  .msg.good{background:#e8fbf4;color:var(--good)}.msg.bad{background:#fff0ed;color:var(--bad)}.msg.info{background:#eef3ff;color:#31549e}

  .fineprint{margin-top:19px;font-size:11px;color:#8b98ae;line-height:1.55;text-align:center}@media(max-width:480px){body{padding:18px 12px;align-items:flex-start}.card{border-radius:24px;padding:29px 22px 22px}h1{font-size:26px}}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Student Induction Program</div>
    <h1>Mark your attendance</h1>
    <div class="venue" id="venueLabel">Loading venue details…</div>

    <div class="radar idle" id="radar">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="pin"></div>
    </div>

    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="e.g. Aarav Sharma" autocomplete="off" />
    </div>
    <div class="field">
      <label for="branch">Branch</label>
      <input type="text" id="branch" list="branchList" placeholder="e.g. Computer Science & Engineering" autocomplete="off" />
      <datalist id="branchList">
        <option value="Computer Science & Engineering">
        <option value="Computer Science & Engineering (IoT)">
        <option value="Electronics & Communication Engineering">
        <option value="Electrical Engineering">
        <option value="Mechanical Engineering">
        <option value="Civil Engineering">
        <option value="Information Technology">
        <option value="Textile Engineering">
      </datalist>
    </div>
    <div class="field">
      <label for="mobile">Mobile number</label>
      <input type="tel" id="mobile" placeholder="10-digit mobile number" autocomplete="off" maxlength="10" inputmode="numeric" />
    </div>
    <div class="field">
      <label for="email">Email <span class="optional">(optional)</span></label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="off" />
    </div>

    <button id="submitBtn">Check In</button>

    <div class="msg" id="msg"></div>

    <div class="fineprint">Your location is used once, only to confirm you're at the venue. One check-in per mobile number and per device, per day.</div>
  </div>

<script>
  const radar = document.getElementById('radar');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const nameInput = document.getElementById('name');
  const branchInput = document.getElementById('branch');
  const mobileInput = document.getElementById('mobile');
  const emailInput = document.getElementById('email');
  const venueLabel = document.getElementById('venueLabel');

  mobileInput.addEventListener('input', () => {
    mobileInput.value = mobileInput.value.replace(/\D/g, '').slice(0, 10);
  });

  function getDeviceId(){
    let id = localStorage.getItem('induction_device_id');
    if(!id){
      id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('induction_device_id', id);
    }
    return id;
  }
  const deviceId = getDeviceId();

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg show ' + type;
  }
  function setRadar(state){
    radar.className = 'radar ' + state;
  }

  async function readApiResponse(res){
    const contentType = res.headers.get('content-type') || '';
    if(!contentType.includes('application/json')){
      const body = await res.text();
      const detail = body.trim().startsWith('<')
        ? 'The server returned the web page instead of the attendance API.'
        : 'The server returned an unexpected response.';
      throw new Error(`${detail} Start this project with \"npm start\" (not a static/live server) and open http://localhost:3000.`);
    }
    return res.json();
  }

  async function loadStatus(){
    try{
      const res = await fetch(`/api/status?deviceId=${encodeURIComponent(deviceId)}`);
      const data = await readApiResponse(res);
      venueLabel.textContent = `${data.venue.label} · within ${data.venue.radius}m`;
      if(data.deviceAlreadyMarked){
        showMsg(`This device has already marked ${data.window.session === 'morning' ? 'before-lunch' : 'after-lunch'} attendance.`, 'info');
        btn.disabled = true;
        setRadar('idle');
      } else if(!data.window.open){
        showMsg(data.window.message, 'info');
        btn.disabled = true;
      } else {
        showMsg(`${data.window.session === 'morning' ? 'Before-lunch' : 'After-lunch'} attendance is open.`, 'info');
      }
    }catch(e){
      venueLabel.textContent = 'Could not reach the server.';
    }
  }
  loadStatus();

  function getLocation(){
    return new Promise((resolve, reject) => {
      if(!navigator.geolocation){
        reject(new Error('Your browser does not support location services.'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        err => {
          let m = 'Could not get your location.';
          if(err.code === 1) m = 'Location permission denied. Please allow location access and try again.';
          if(err.code === 2) m = 'Location unavailable. Try moving to an open area.';
          if(err.code === 3) m = 'Location request timed out. Try again.';
          reject(new Error(m));
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  btn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    const branch = branchInput.value.trim();
    const mobile = mobileInput.value.trim();
    const email = emailInput.value.trim();

    if(!name){ showMsg('Enter your full name.', 'bad'); return; }
    if(!branch){ showMsg('Enter your branch.', 'bad'); return; }
    if(!/^\d{10}$/.test(mobile)){ showMsg('Enter a valid 10-digit mobile number.', 'bad'); return; }

    btn.disabled = true;
    setRadar('locating');
    radar.classList.remove('idle','ok','err');
    showMsg('Getting your location…', 'info');

    try{
      const coords = await getLocation();
      const res = await fetch('/api/attendance/mark', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name, branch, mobile, email, deviceId,
          lat: coords.latitude, lng: coords.longitude, accuracy: coords.accuracy
        })
      });
      const data = await readApiResponse(res);
      if(data.ok){
        setRadar('ok');
        showMsg(data.message + ` (${data.distance}m from venue)`, 'good');
        btn.disabled = true;
      } else {
        setRadar('err');
        showMsg(data.error, 'bad');
        btn.disabled = false;
      }
    }catch(e){
      setRadar('err');
      showMsg(e.message, 'bad');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
